<style>

body{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
header{min-height:56px;padding-inline:18px;gap:10px}
.brand{display:inline-flex;align-items:center;gap:4px;letter-spacing:-.45px;font-size:16px}

article th,article td{text-align:left;font-size:14px}

main:has(aside[hidden]){grid-template-columns:minmax(0,1fr)}

<style>
html,body{height:100%;overflow:hidden}

.panes{overflow:hidden}
.app-logo{width:32px;height:32px;margin-right:4px}

article{padding-inline:clamp(18px,3vw,54px)}

@media(max-width:560px){.pane{min-height:0}.panes{flex-direction:column}.brand{display:inline-flex}}

<style>
